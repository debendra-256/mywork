<!doctype html>
<html lang="en" data-theme="premium-purple" data-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('imgmojo:user-theme-selected') || localStorage.getItem('imgmojo:site-theme') || localStorage.getItem('promptseen:site-theme');
          if (t && ['premium-purple', 'dark-neon', 'ocean-cyan', 'sunset-gradient'].indexOf(t) !== -1) {
            document.documentElement.dataset.theme = t;
            document.documentElement.dataset.scheme = (t === 'dark-neon') ? 'dark' : 'light';
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Title -->
    <title>ImgMojo – Free Online Image, Video, PDF &amp; QR Code Tools, Screen Recording</title>

    <meta name="description" content="ImgMojo provides free online tools for everyone. Compress images, edit PDFs, create QR codes, create video to shorts and reels, provide free screen recording application, convert videos and use powerful utilities easily." />
