<!doctype html>
<html lang="en" data-theme="premium-purple" data-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('imgmojo:user-theme-selected') || localStorage.getItem('imgmojo:site-theme') || localStorage.getItem('promptseen:site-theme');
          if (t && ['premium-purple', 'dark-neon', 'ocean-cyan', 'sunset-gradient'].indexOf(t) !== -1) {
            document.documentElement.dataset.theme = t;
            document.documentElement.dataset.scheme = (t === 'dark-neon') ? 'dark' : 'light';
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3fb" />
    <title>ImgMojo — Create Magic. Edit Anything.</title>
    <meta name="description" content="Free creative AI prompt library and tools: poster maker, watermark remover, collage editor, and prompt generator. 100% free on-device." />
    <link rel="canonical" href="https://www.imgmojo.com/" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:site_name" content="ImgMojo" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.imgmojo.com/" />
    <meta property="og:title" content="ImgMojo — Create Magic. Edit Anything." />
    <meta property="og:description" content="Free creative AI prompt library and tools: poster maker, watermark remover, collage editor, and prompt generator. 100% free on-device." />
    <meta property="og:image" content="https://www.imgmojo.com/images/imgmojo-og.jpg" />
    <meta property="og:image:secure_url" content="https://www.imgmojo.com/images/imgmojo-og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ImgMojo — Creative AI Tools & Prompts" />

    <!-- WhatsApp Square Preview Fallback (<300KB) -->
    <meta property="og:image" content="https://www.imgmojo.com/images/imgmojo-share.jpg" />
    <meta property="og:image:secure_url" content="https://www.imgmojo.com/images/imgmojo-share.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <link rel="image_src" href="https://www.imgmojo.com/images/imgmojo-share.jpg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.imgmojo.com/" />
    <meta name="twitter:title" content="ImgMojo — Create Magic. Edit Anything." />
    <meta name="twitter:description" content="Free creative AI prompt library and tools: poster maker, watermark remover, collage editor, and prompt generator. 100% free on-device." />
    <meta name="twitter:image" content="https://www.imgmojo.com/images/imgmojo-og.jpg" />

    <!-- Schema.org for Google / WhatsApp -->
    <meta itemprop="name" content="ImgMojo — Create Magic. Edit Anything." />
    <meta itemprop="description" content="Free creative AI prompt library and tools: poster maker, watermark remover, collage editor, and prompt generator. 100% free on-device." />
    <meta itemprop="image" content="https://www.imgmojo.com/images/imgmojo-og.jpg" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/imgmojo-mark.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the app UI family is render-critical; the editor font library loads on demand with the poster/collage tools. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet" />
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6531733010019683"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
