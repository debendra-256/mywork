<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#0f172a"/>

  <!-- Main Window -->
  <g filter="url(#shadow)">
    <rect x="40" y="25" width="520" height="310" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="40" y="25" width="520" height="38" rx="14" fill="#0f172a"/>
    <rect x="40" y="49" width="520" height="14" fill="#0f172a"/>
    <circle cx="62" cy="44" r="5" fill="#ef4444"/>
    <circle cx="78" cy="44" r="5" fill="#f59e0b"/>
    <circle cx="94" cy="44" r="5" fill="#10b981"/>
    <text x="300" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Custom Branded QR Code Generator</text>
  </g>

  <!-- Left: Controls & Types -->
  <g>
    <rect x="65" y="80" width="220" height="235" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="105" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">QR Content Type</text>
    
    <!-- Type Pills -->
    <rect x="80" y="118" width="55" height="24" rx="6" fill="#10b981"/>
    <text x="107" y="134" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">URL</text>
    <rect x="142" y="118" width="55" height="24" rx="6" fill="#1e293b"/>
    <text x="169" y="134" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Wi-Fi</text>
    <rect x="204" y="118" width="55" height="24" rx="6" fill="#1e293b"/>
    <text x="231" y="134" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">vCard</text>

    <!-- URL Input -->
    <text x="80" y="165" fill="#94a3b8" font-family="sans-serif" font-size="10">Target Website Link</text>
    <rect x="80" y="174" width="190" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="90" y="193" fill="#38bdf8" font-family="monospace" font-size="10">https://imgmojo.com</text>

    <!-- Styling options -->
    <text x="80" y="228" fill="#94a3b8" font-family="sans-serif" font-size="10">Dots Shape &amp; Gradient</text>
    <circle cx="95" cy="248" r="10" fill="url(#qrGrad)"/>
    <circle cx="125" cy="248" r="10" fill="#6366f1"/>
    <circle cx="155" cy="248" r="10" fill="#ec4899"/>
    <circle cx="185" cy="248" r="10" fill="#f59e0b"/>

    <rect x="80" y="272" width="190" height="30" rx="6" fill="#10b981"/>
    <text x="175" y="291" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Generate HD QR ⚡</text>
  </g>

  <!-- Right: Generated High-Res QR Code Preview -->
  <g filter="url(#shadow)">
    <rect x="315" y="80" width="220" height="235" rx="10" fill="#ffffff"/>
    
    <!-- QR Corner Targets -->
    <rect x="335" y="100" width="46" height="46" rx="10" fill="#047857"/>
    <rect x="341" y="106" width="34" height="34" rx="6" fill="#ffffff"/>
    <rect x="347" y="112" width="22" height="22" rx="4" fill="#047857"/>

    <rect x="469" y="100" width="46" height="46" rx="10" fill="#047857"/>
    <rect x="475" y="106" width="34" height="34" rx="6" fill="#ffffff"/>
    <rect x="481" y="112" width="22" height="22" rx="4" fill="#047857"/>

    <rect x="335" y="234" width="46" height="46" rx="10" fill="#047857"/>
    <rect x="341" y="240" width="34" height="34" rx="6" fill="#ffffff"/>
    <rect x="347" y="246" width="22" height="22" rx="4" fill="#047857"/>

    <!-- QR Dots matrix -->
    <circle cx="395" cy="110" r="5" fill="#059669"/>
    <circle cx="410" cy="110" r="5" fill="#059669"/>
    <circle cx="440" cy="110" r="5" fill="#059669"/>
    <circle cx="425" cy="125" r="5" fill="#0284c7"/>
    <circle cx="395" cy="140" r="5" fill="#0284c7"/>
    <circle cx="440" cy="140" r="5" fill="#059669"/>
    
    <circle cx="395" cy="245" r="5" fill="#0284c7"/>
    <circle cx="425" cy="245" r="5" fill="#059669"/>
    <circle cx="475" cy="245" r="5" fill="#0284c7"/>
    <circle cx="505" cy="245" r="5" fill="#059669"/>
    <circle cx="440" cy="265" r="5" fill="#059669"/>
    <circle cx="490" cy="265" r="5" fill="#0284c7"/>

    <!-- Center Logo Badge -->
    <circle cx="425" cy="190" r="24" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="425" cy="190" r="20" fill="url(#qrGrad)"/>
    <text x="425" y="196" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">M</text>
  </g>
</svg>