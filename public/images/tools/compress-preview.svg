<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#0f172a"/>

  <!-- Main Window -->
  <g filter="url(#shadow)">
    <rect x="40" y="25" width="520" height="310" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Title Bar -->
    <rect x="40" y="25" width="520" height="38" rx="14" fill="#0f172a"/>
    <rect x="40" y="49" width="520" height="14" fill="#0f172a"/>
    <circle cx="62" cy="44" r="5" fill="#ef4444"/>
    <circle cx="78" cy="44" r="5" fill="#f59e0b"/>
    <circle cx="94" cy="44" r="5" fill="#10b981"/>
    <text x="300" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Smart Image Compressor · Batch Optimization</text>
  </g>

  <!-- Left: File comparison cards -->
  <g>
    <!-- Original Card -->
    <rect x="70" y="85" width="180" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="85" y="100" width="40" height="40" rx="8" fill="#f43f5e" fill-opacity="0.2"/>
    <text x="105" y="125" fill="#f43f5e" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">JPG</text>
    <text x="135" y="115" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">photo_raw.jpg</text>
    <text x="135" y="132" fill="#94a3b8" font-family="sans-serif" font-size="10">4000 × 3000 px</text>
    <rect x="85" y="160" width="150" height="1" fill="#1e293b"/>
    <text x="85" y="185" fill="#64748b" font-family="sans-serif" font-size="10">Original Size</text>
    <text x="85" y="212" fill="#ef4444" font-family="system-ui, sans-serif" font-size="20" font-weight="800">4.85 MB</text>

    <!-- Arrow / Reduction badge -->
    <circle cx="280" cy="160" r="22" fill="#10b981" filter="url(#shadow)"/>
    <path d="M 272 160 L 285 160 M 281 154 L 287 160 L 281 166" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Compressed Card -->
    <rect x="310" y="85" width="220" height="150" rx="10" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1.5"/>
    <rect x="325" y="100" width="40" height="40" rx="8" fill="#10b981" fill-opacity="0.3"/>
    <text x="345" y="125" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="375" y="115" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">photo_optimized.jpg</text>
    <text x="375" y="132" fill="#a7f3d0" font-family="sans-serif" font-size="10">High Visual Quality (85%)</text>
    <rect x="325" y="160" width="190" height="1" fill="#047857" fill-opacity="0.5"/>
    
    <text x="325" y="185" fill="#a7f3d0" font-family="sans-serif" font-size="10">Optimized Size</text>
    <text x="325" y="215" fill="#10b981" font-family="system-ui, sans-serif" font-size="24" font-weight="900">412 KB</text>
    
    <rect x="435" y="180" width="80" height="32" rx="6" fill="#10b981"/>
    <text x="475" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">- 91.5%</text>
  </g>

  <!-- Bottom Quality Slider Control Bar -->
  <g>
    <rect x="70" y="255" width="460" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="90" y="285" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Compression Level: 85%</text>
    
    <rect x="235" y="278" width="170" height="6" rx="3" fill="#334155"/>
    <rect x="235" y="278" width="145" height="6" rx="3" fill="#10b981"/>
    <circle cx="380" cy="281" r="7" fill="#ffffff" filter="url(#shadow)"/>

    <rect x="425" y="266" width="95" height="30" rx="6" fill="#2563eb"/>
    <text x="472" y="285" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Download 📥</text>
  </g>
</svg>